<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>3 Things</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3 Things">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
  /* Drop your licensed Neue Haas Grotesk Display 65 Medium file next to this page
     with this exact name and it will be used automatically. */
  @font-face {
    font-family: "NHG";
    src: url("NeueHaasDisplay-Medium.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root { --ink: #111111; --paper: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); }
  body {
    color: var(--ink);
    font-family: "NHG", "Neue Haas Grotesk Display Pro", "Neue Haas Grotesk Display", "NHaasGroteskDSPro-65Md", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.2;
    text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  button, input { font: inherit; color: inherit; text-transform: uppercase; background: none; border: none; outline: none; }
  button { cursor: pointer; text-align: left; padding: 0; }
  input { width: 100%; padding: 0; -webkit-user-select: text; user-select: text; border-radius: 0; }
  input::placeholder { color: var(--ink); opacity: 1; }
  .app {
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
  }
  .bar { display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
  .on { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
  main { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  main.today { justify-content: center; gap: 28px; }
  main.list { padding: 40px 0; gap: 22px; }
  .row { display: flex; gap: 18px; align-items: baseline; }
  .n { flex-shrink: 0; min-width: 14px; }
  .task { flex-grow: 1; touch-action: pan-y; cursor: grab; transition: transform .18s ease; will-change: transform; }
  .task.dragging { transition: none; }
  .done { text-decoration: line-through; text-decoration-thickness: 2px; }
  .group { display: flex; flex-direction: column; gap: 14px; }
  .groups { display: flex; flex-direction: column; gap: 36px; }
  .pop { animation: pop .25s ease; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button data-tab="today" id="tabToday">Today</button>
    <button data-tab="all" id="tabAll">All</button>
  </div>
  <main id="main"></main>
  <div class="bar">
    <div id="points">0</div>
    <button data-tab="done" id="tabDone">Done</button>
  </div>
</div>

<script>
(function () {
  var KEY = '3things.v1';
  var main = document.getElementById('main');
  var S;

  function dayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function load() {
    try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
    if (!S || !S.tasks) S = { tasks: [], history: [], points: 0, day: dayKey(), tab: 'today', more: false };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  // End of day: finished tasks go to Done, unfinished go back to All.
  function rollover() {
    if (S.day === dayKey()) return false;
    var finished = S.tasks.filter(function (t) { return t.where === 'today' && t.done; });
    S.history = finished.map(function (t) { return t.text; }).reverse().concat(S.history);
    S.tasks = S.tasks
      .filter(function (t) { return !(t.where === 'today' && t.done); })
      .map(function (t) { if (t.where === 'today') { t.where = 'all'; t.done = false; } return t; });
    S.day = dayKey();
    S.more = false;
    save();
    return true;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : ''; }

  function parse(raw) {
    raw = (raw || '').trim();
    var k = raw.indexOf(':');
    var cat = k > 0 ? raw.slice(0, k).trim() : '';
    var text = (k > 0 ? raw.slice(k + 1) : raw).trim();
    return { cat: cap(cat), text: text };
  }
  function add(where, raw) {
    var p = parse(raw);
    if (!p.text) return false;
    S.tasks.push({ id: Date.now() + Math.random(), text: p.text, cat: p.cat, where: where, done: false });
    return true;
  }
  function find(id) {
    for (var i = 0; i < S.tasks.length; i++) if (String(S.tasks[i].id) === String(id)) return S.tasks[i];
    return null;
  }
  function todays() { return S.tasks.filter(function (t) { return t.where === 'today'; }); }

  var bump = false;

  function render(focusId) {
    var today = todays();
    var doneCount = today.filter(function (t) { return t.done; }).length;

    document.getElementById('tabToday').textContent = 'Today ' + doneCount + '/3';
    document.getElementById('tabToday').className = S.tab === 'today' ? 'on' : '';
    document.getElementById('tabAll').className = S.tab === 'all' ? 'on' : '';
    document.getElementById('tabDone').className = S.tab === 'done' ? 'on' : '';
    var pts = document.getElementById('points');
    pts.textContent = S.points.toLocaleString('en-US');
    if (bump) { pts.classList.remove('pop'); void pts.offsetWidth; pts.classList.add('pop'); bump = false; }

    var h = '';
    if (S.tab === 'today') {
      main.className = 'today';
      today.forEach(function (t, i) {
        h += '<div class="row"><span class="n">' + (i + 1) + '</span>' +
             '<span class="task' + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
             esc(t.text) + (t.cat ? ' / ' + esc(t.cat) : '') + '</span></div>';
      });
      var rows = today.length;
      if (today.length < 3 || S.more) {
        rows++;
        h += '<div class="row"><span class="n">' + rows + '</span>' +
             '<input id="addToday" placeholder="+" enterkeyhint="done" autocomplete="off" autocorrect="off"></div>';
      }
      while (rows < 3) { rows++; h += '<div class="row"><span class="n">' + rows + '</span><span>—</span></div>'; }
      if (today.length >= 3 && !S.more) h += '<button id="more">...</button>';
    } else if (S.tab === 'all') {
      main.className = 'list';
      var cats = [];
      S.tasks.forEach(function (t) {
        var c = t.cat || 'Inbox';
        if (t.where === 'all' && cats.indexOf(c) < 0) cats.push(c);
      });
      h += '<div class="groups">';
      cats.forEach(function (c) {
        h += '<div class="group"><div>' + esc(c) + ':</div>';
        S.tasks.forEach(function (t) {
          if (t.where === 'all' && (t.cat || 'Inbox') === c)
            h += '<div class="task" data-id="' + t.id + '">' + esc(t.text) + '</div>';
        });
        h += '</div>';
      });
      h += '<input id="addAll" placeholder="+ Home: buy bulbs" enterkeyhint="done" autocomplete="off" autocorrect="off"></div>';
    } else {
      main.className = 'list';
      S.history.forEach(function (x) { h += '<div class="done">' + esc(x) + '</div>'; });
    }
    main.innerHTML = h;
    if (focusId) { var f = document.getElementById(focusId); if (f) f.focus(); }
  }

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { S.tab = b.getAttribute('data-tab'); S.more = false; save(); render(); });
  });

  // Typing
  main.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var el = e.target;
    if (el.id === 'addToday') {
      if (add('today', el.value)) { S.more = false; save(); render(todays().length < 3 ? 'addToday' : null); }
      else el.blur();
    }
    if (el.id === 'addAll') {
      if (add('all', el.value)) { save(); render('addAll'); }
      else el.blur();
    }
  });
  main.addEventListener('click', function (e) {
    if (e.target.id === 'more') { S.more = true; save(); render('addToday'); }
  });

  // Gestures on tasks
  // Today: swipe right = cross out (+1) / undo (-1); swipe left = back to All.
  // All: tap = move to Today; swipe left = delete.
  var drag = null;
  main.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.task');
    if (!el) return;
    drag = { el: el, id: el.getAttribute('data-id'), x: e.clientX, y: e.clientY, dx: 0, moved: false };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(drag.dx)) { drag = null; return; }
    if (Math.abs(drag.dx) > 6) {
      drag.moved = true;
      drag.el.classList.add('dragging');
      drag.el.style.transform = 'translateX(' + (drag.dx * 0.6) + 'px)';
    }
  });
  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    d.el.classList.remove('dragging');
    d.el.style.transform = '';
    var t = find(d.id);
    if (!t) return;
    if (S.tab === 'today') {
      if (d.dx > 50) {
        t.done = !t.done;
        S.points += t.done ? 1 : -1;
        if (t.done) bump = true;
        save(); render();
      } else if (d.dx < -70 && !t.done) {
        t.where = 'all'; save(); render();
      }
    } else if (S.tab === 'all') {
      if (!d.moved) { t.where = 'today'; save(); render(); }
      else if (d.dx < -70) { S.tasks = S.tasks.filter(function (x) { return x !== t; }); save(); render(); }
    }
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', function () {
    if (drag) { drag.el.classList.remove('dragging'); drag.el.style.transform = ''; drag = null; }
  });

  // Day change checks
  function check() { if (rollover()) render(); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 60000);

  load();
  rollover();
  render();
})();
</script>
</body>
</html>
