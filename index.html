<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 Things</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3 Things">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
  /* Put your licensed Neue Haas Grotesk Display 65 Medium next to this page
     under this exact name and it is used automatically. */
  @font-face {
    font-family: "NHG";
    src: url("NeueHaasDisplay-Medium.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root { --ink: #111111; --paper: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); }
  body {
    color: var(--ink);
    font-family: "NHG", "Neue Haas Grotesk Display Pro", "Neue Haas Grotesk Display", "NHaasGroteskDSPro-65Md", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.2;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .caps { text-transform: uppercase; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; text-align: left; cursor: pointer; text-transform: uppercase; }
  input {
    font: inherit; color: inherit; background: none; border: none; outline: none; padding: 0;
    width: 100%; border-radius: 0; caret-color: var(--ink);
    border-bottom: 2px solid transparent;
  }
  input:focus { border-bottom-color: var(--ink); }
  .app {
    height: 100dvh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
  }
  .bar { display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
  .on { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
  main { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  main.today { justify-content: center; gap: 28px; }
  main.list { padding: 40px 0; gap: 22px; }
  .row { display: flex; gap: 18px; align-items: baseline; }
  .n { flex-shrink: 0; min-width: 14px; }
  .grow { flex-grow: 1; }
  .task { flex-grow: 1; touch-action: pan-y; cursor: grab; transition: transform .18s ease; -webkit-user-select: none; user-select: none; text-transform: uppercase; }
  .task.dragging { transition: none; }
  .done { text-decoration: line-through; text-decoration-thickness: 2px; }
  .groups { display: flex; flex-direction: column; gap: 36px; }
  .group { display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; text-transform: uppercase; }
  .plus { min-width: 44px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-left: 32px; }
  .task, .head { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .lifted { opacity: .35; }
  .pop { animation: pop .25s ease; }
  @keyframes pop { 45% { transform: scale(1.12); } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button data-tab="today" id="tabToday">Today</button>
    <button data-tab="all" id="tabAll">All</button>
  </div>
  <main id="main"></main>
  <div class="bar">
    <div id="points">0</div>
    <button data-tab="done" id="tabDone">Done</button>
  </div>
</div>

<script>
(function () {
  var KEY = '3things.v1';
  var main = document.getElementById('main');
  var S;
  var addingCat = false;   // the "+ Category" line is open
  var more = false;        // an extra empty line on Today after 3
  var pickedCat = '';      // category chosen for the Today line being typed
  var editId = null;       // task being edited
  var editCat = null;      // category being renamed
  var lastTap = null, tapTimer = null;
  var bump = false;

  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function load() {
    try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
    if (!S || !S.tasks) S = { tasks: [], history: [], points: 0, day: dayKey(), tab: 'today' };
    if (!S.cats) {
      S.cats = [];
      S.tasks.forEach(function (t) { if (t.cat && S.cats.indexOf(t.cat) < 0) S.cats.push(t.cat); });
    }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // End of day: finished -> Done for good, unfinished -> back to All.
  function rollover() {
    if (S.day === dayKey()) return false;
    S.history = doneToday().map(function (t) { return t.text; }).concat(S.history);
    S.tasks = S.tasks.filter(function (t) { return !(t.where === 'today' && t.done); })
      .map(function (t) { if (t.where === 'today') { t.where = 'all'; t.done = false; } return t; });
    S.day = dayKey();
    more = false;
    save();
    return true;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function q(s) { return String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }
  function find(id) { for (var i = 0; i < S.tasks.length; i++) if (String(S.tasks[i].id) === String(id)) return S.tasks[i]; return null; }
  function todays() { return S.tasks.filter(function (t) { return t.where === 'today'; }); }
  function doneToday() {
    return todays().filter(function (t) { return t.done; })
      .sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });
  }
  function newTask(text, cat, where) {
    S.tasks.push({ id: Date.now() + '' + Math.floor(Math.random() * 1000), text: text, cat: cat, where: where, done: false });
  }
  function line(attrs, value) {
    return '<input ' + attrs + (value ? ' value="' + esc(value) + '"' : '') +
      ' type="text" autocapitalize="characters" autocomplete="off" spellcheck="true" enterkeyhint="done">';
  }
  function chips(cls, selected, attr) {
    return '<div class="chips ' + cls + '">' + S.cats.map(function (c) {
      return '<button class="' + (selected === c ? 'on' : '') + '" ' + attr + '="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('') + '</div>';
  }

  function render(focusSel) {
    var today = todays();
    var doneCount = today.filter(function (t) { return t.done; }).length;
    var tt = document.getElementById('tabToday');
    tt.textContent = 'Today ' + doneCount + '/3';
    tt.className = S.tab === 'today' ? 'on' : '';
    document.getElementById('tabAll').className = S.tab === 'all' ? 'on' : '';
    document.getElementById('tabDone').className = S.tab === 'done' ? 'on' : '';
    var pts = document.getElementById('points');
    pts.textContent = S.points.toLocaleString('en-US');
    if (bump) { pts.classList.remove('pop'); void pts.offsetWidth; pts.classList.add('pop'); bump = false; }

    var h = '';
    if (S.tab === 'today') {
      main.className = 'today';
      today.forEach(function (t, i) {
        h += '<div class="row"><span class="n">' + (i + 1) + '</span>';
        if (editId === t.id) {
          h += '<span class="grow">' + line('data-in="edit"', t.text) + '</span></div>';
        } else {
          h += '<span class="task' + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
               esc(t.text) + (t.cat ? ' / ' + esc(t.cat) : '') + '</span></div>';
        }
      });
      var n = today.length;
      var slots = Math.max(3, n + (more ? 1 : 0));
      while (n < slots) {
        n++;
        h += '<div class="row"><span class="n">' + n + '</span><span class="grow">' + line('data-in="today"') + '</span></div>';
      }
      if (today.length >= 3 && !more) h += '<button id="more">...</button>';
    } else if (S.tab === 'all') {
      main.className = 'list';
      h += '<div class="groups">';
      var cats = S.cats.slice();
      if (S.tasks.some(function (t) { return t.where === 'all' && !t.cat; })) cats.push('');
      cats.forEach(function (c) {
        h += '<div class="group">';
        if (c && editCat === c) h += line('data-in="editcat"', c);
        else h += '<div class="head" data-cat="' + esc(c) + '"><span>' + (c ? esc(c) : 'Other') + ':</span></div>';
        S.tasks.forEach(function (t) {
          if (t.where !== 'all' || (t.cat || '') !== c) return;
          if (editId === t.id) {
            h += line('data-in="edit"', t.text);
          } else {
            h += '<div class="head"><span class="task" data-id="' + t.id + '">' + esc(t.text) + '</span>' +
                 '<button class="plus" data-today="' + t.id + '" aria-label="Move to Today">+</button></div>';
          }
        });
        if (c) h += line('data-in="task" data-for="' + esc(c) + '"');
        h += '</div>';
      });
      if (addingCat) h += '<div class="group">' + line('data-in="cat"') + '</div>';
      else h += '<button id="newcat">+ Category</button>';
      h += '</div>';
    } else {
      main.className = 'list';
      doneToday().forEach(function (t) { h += '<div class="done caps">' + esc(t.text) + '</div>'; });
      S.history.forEach(function (x) { h += '<div class="done caps">' + esc(x) + '</div>'; });
    }
    main.innerHTML = h;
    if (drag && drag.lifted) {
      var me = main.querySelector('[data-id="' + q(drag.id || '') + '"]') || (drag.cat ? main.querySelector('.head[data-cat="' + q(drag.cat) + '"]') : null);
      if (me) { me.classList.add('lifted'); drag.el = me; }
    }
    if (focusSel) {
      var f = main.querySelector(focusSel);
      if (f) { f.focus(); var L = f.value.length; try { f.setSelectionRange(L, L); } catch (e) {} }
    }
  }

  // Save what's typed in a line. Returns the selector to keep typing in, or null.
  function commit(el) {
    var text = el.value.trim();
    var kind = el.getAttribute('data-in');
    el.value = '';
    if (kind === 'edit') {
      var t = find(editId);
      editId = null;
      if (t) { if (text) t.text = text; else S.tasks = S.tasks.filter(function (x) { return x !== t; }); save(); }
      return null;
    }
    if (kind === 'editcat') {
      var old = editCat; editCat = null;
      var nn = text.toUpperCase();
      if (!nn) {
        // name erased: the category and its tasks in All go away
        S.cats = S.cats.filter(function (c) { return c !== old; });
        S.tasks = S.tasks.filter(function (x) { return !(x.where === 'all' && x.cat === old); });
        S.tasks.forEach(function (x) { if (x.cat === old) x.cat = ''; });
        save();
      } else if (nn !== old && S.cats.indexOf(nn) < 0) {
        S.cats = S.cats.map(function (c) { return c === old ? nn : c; });
        S.tasks.forEach(function (x) { if (x.cat === old) x.cat = nn; });
        save();
      }
      return null;
    }
    if (!text) { if (kind === 'cat') addingCat = false; return null; }
    if (kind === 'today') {
      newTask(text, pickedCat, 'today'); pickedCat = ''; more = false; save();
      return todays().length < 3 ? '[data-in="today"]' : null;
    }
    if (kind === 'task') {
      var c = el.getAttribute('data-for');
      newTask(text, c, 'all'); save();
      return '[data-in="task"][data-for="' + q(c) + '"]';
    }
    if (kind === 'cat') {
      var name = text.toUpperCase();
      if (S.cats.indexOf(name) < 0) S.cats.push(name);
      addingCat = false; save();
      return '[data-in="task"][data-for="' + q(name) + '"]';
    }
    return null;
  }

  function closeAll() { addingCat = false; more = false; pickedCat = ''; editId = null; editCat = null; }

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { closeAll(); S.tab = b.getAttribute('data-tab'); save(); render(); });
  });

  // Return key saves
  main.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target.hasAttribute('data-in')) return;
    e.preventDefault();
    render(commit(e.target));
  });

  // Category words under the Today line being typed
  var activeInput = null;
  function removeChips() { var c = main.querySelector('.todaychips'); if (c) c.remove(); }
  main.addEventListener('focusin', function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute('data-in')) activeInput = el;
  });
  main.addEventListener('focusout', function (e) {
    var el = e.target;
    if (!el.hasAttribute || !el.hasAttribute('data-in')) return;
    setTimeout(function () {
      if (document.activeElement === el) return;   // came back (tapped a category word)
      if (!document.body.contains(el)) return;      // already re-rendered
      var kind = el.getAttribute('data-in');
      if (el.value.trim() || kind === 'edit' || kind === 'editcat') { commit(el); render(); return; }
      if (kind === 'cat') { addingCat = false; render(); return; }
    }, 250);
  });
  function stopBlur(e) { if (e.target.closest('[data-chip], [data-recat]')) e.preventDefault(); }
  main.addEventListener('mousedown', stopBlur);
  main.addEventListener('pointerdown', stopBlur);

  // Buttons
  main.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-chip]');
    if (chip) {
      var c = chip.getAttribute('data-chip');
      pickedCat = pickedCat === c ? '' : c;
      main.querySelectorAll('[data-chip]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-chip') === pickedCat); });
      if (activeInput) activeInput.focus();
      return;
    }
    var rc = e.target.closest('[data-recat]');
    if (rc) {
      var t = find(editId);
      if (t) {
        var nc = rc.getAttribute('data-recat');
        t.cat = t.cat === nc && t.where === 'today' ? '' : nc;
        var f = main.querySelector('[data-in="edit"]');
        if (f && f.value.trim()) t.text = f.value.trim();
        save();
      }
      editId = null; render();
      return;
    }
    var td = e.target.closest('[data-today]');
    if (td) {
      var tk = find(td.getAttribute('data-today'));
      if (tk) { tk.where = 'today'; save(); render(); }
      return;
    }
    if (e.target.id === 'more') { more = true; render('[data-in="today"]'); return; }
    if (e.target.id === 'newcat') { addingCat = true; render('[data-in="cat"]'); return; }
  });

  // Gestures
  // Tap = edit (task or category name). Today: double tap or swipe right = cross out (+1) / undo (-1);
  // swipe left = back to All. All: swipe left = delete task (or an empty category).
  // Long press, then drag = move it (between categories too).
  var drag = null;
  main.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.task, .head[data-cat]');
    if (!el || e.target.closest('button, input')) return;
    drag = { el: el, id: el.getAttribute('data-id'), cat: el.getAttribute('data-cat'), x: e.clientX, y: e.clientY, dx: 0, moved: false, lifted: false };
    var d = drag;
    d.timer = setTimeout(function () {
      if (drag !== d || d.moved) return;
      d.lifted = true;
      d.el.classList.add('lifted');
      if (navigator.vibrate) navigator.vibrate(10);
    }, 450);
  });
  // While moving something, stop the page from scrolling
  document.addEventListener('touchmove', function (e) { if (drag && drag.lifted) e.preventDefault(); }, { passive: false });

  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (drag.lifted) { dropOver(e.clientX, e.clientY); return; }
    drag.dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(drag.dx)) { reset(); return; }
    if (Math.abs(drag.dx) > 6) {
      drag.moved = true;
      drag.el.classList.add('dragging');
      drag.el.style.transform = 'translateX(' + (drag.dx * 0.6) + 'px)';
    }
  });

  function dropOver(x, y) {
    var under = document.elementFromPoint(x, y);
    if (!under || !main.contains(under)) return;
    var tgtTask = under.closest('[data-id]');
    var tgtCat = under.closest('.head[data-cat]');
    if (drag.id) {
      var me = find(drag.id);
      if (!me) return;
      if (tgtTask) {
        var other = find(tgtTask.getAttribute('data-id'));
        if (!other || other === me || other.where !== me.where) return;
        var from = S.tasks.indexOf(me), to = S.tasks.indexOf(other);
        S.tasks.splice(from, 1);
        S.tasks.splice(to, 0, me);
        if (me.where === 'all') me.cat = other.cat;
        render();
      } else if (tgtCat && me.where === 'all') {
        var c = tgtCat.getAttribute('data-cat');
        if ((me.cat || '') === c) return;
        S.tasks.splice(S.tasks.indexOf(me), 1);
        var first = -1;
        S.tasks.forEach(function (t, i) { if (first < 0 && t.where === 'all' && (t.cat || '') === c) first = i; });
        if (first < 0) S.tasks.push(me); else S.tasks.splice(first, 0, me);
        me.cat = c;
        render();
      }
    } else if (drag.cat && tgtCat) {
      var c2 = tgtCat.getAttribute('data-cat');
      if (!c2 || c2 === drag.cat) return;
      var a = S.cats.indexOf(drag.cat), b = S.cats.indexOf(c2);
      S.cats.splice(a, 1);
      S.cats.splice(b, 0, drag.cat);
      render();
    }
  }

  function reset() {
    if (drag) { clearTimeout(drag.timer); if (drag.el) { drag.el.classList.remove('dragging', 'lifted'); drag.el.style.transform = ''; } }
    drag = null;
  }

  window.addEventListener('pointerup', function () {
    if (!drag) return;
    var d = drag; reset();
    if (d.lifted) { save(); render(); return; }

    if (d.id === null) { // category name
      if (!d.moved && d.cat) { editCat = d.cat; render('[data-in="editcat"]'); return; }
      if (d.cat && d.dx < -70 && !S.tasks.some(function (t) { return t.cat === d.cat; })) {
        S.cats = S.cats.filter(function (c) { return c !== d.cat; }); save(); render();
      }
      return;
    }
    var t = find(d.id);
    if (!t) return;
    if (S.tab === 'today') {
      if (!d.moved) {
        var now = Date.now();
        if (lastTap && lastTap.id === d.id && now - lastTap.time < 350) {
          clearTimeout(tapTimer); lastTap = null; cross(t);
        } else {
          lastTap = { id: d.id, time: now };
          clearTimeout(tapTimer);
          tapTimer = setTimeout(function () { lastTap = null; editId = t.id; render('[data-in="edit"]'); }, 320);
        }
        return;
      }
      if (d.dx > 50) cross(t);
      else if (d.dx < -70 && !t.done) { t.where = 'all'; save(); render(); }
    } else if (S.tab === 'all') {
      if (!d.moved) { editId = t.id; render('[data-in="edit"]'); }
      else if (d.dx < -70) { S.tasks = S.tasks.filter(function (x) { return x !== t; }); save(); render(); }
    }
  });
  window.addEventListener('pointercancel', function () { if (drag && drag.lifted) { save(); reset(); render(); } else reset(); });

  function cross(t) {
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : 0;
    S.points += t.done ? 1 : -1;
    if (t.done) bump = true;
    save(); render();
  }

  function check() {
    var a = document.activeElement;
    var typing = a && a.hasAttribute && a.hasAttribute('data-in');
    if (!typing && !drag && rollover()) render();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 60000);

  load();
  rollover();
  render();
})();
</script>
</body>
</html>
