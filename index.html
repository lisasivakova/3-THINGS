<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 Things</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3 Things">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
  /* Put your licensed Neue Haas Grotesk Display 65 Medium next to this page
     under this exact name and it is used automatically. */
  @font-face {
    font-family: "NHG";
    src: url("NeueHaasDisplay-Medium.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root { --ink: #111111; --paper: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); }
  body {
    color: var(--ink);
    font-family: "NHG", "Neue Haas Grotesk Display Pro", "Neue Haas Grotesk Display", "NHaasGroteskDSPro-65Md", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.2;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .caps { text-transform: uppercase; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; text-align: left; cursor: pointer; text-transform: uppercase; }
  input {
    font: inherit; color: inherit; background: none; border: none; outline: none; padding: 0;
    width: 100%; border-radius: 0; caret-color: var(--ink);
    border-bottom: 2px solid var(--ink);
  }
  .app {
    height: 100dvh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
  }
  .bar { display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
  .on { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
  main { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  main.today { justify-content: center; gap: 28px; }
  main.list { padding: 40px 0; gap: 22px; }
  .row { display: flex; gap: 18px; align-items: baseline; }
  .n { flex-shrink: 0; min-width: 14px; }
  .grow { flex-grow: 1; }
  .task { flex-grow: 1; touch-action: pan-y; cursor: grab; transition: transform .18s ease; -webkit-user-select: none; user-select: none; text-transform: uppercase; }
  .task.dragging { transition: none; }
  .done { text-decoration: line-through; text-decoration-thickness: 2px; }
  .groups { display: flex; flex-direction: column; gap: 36px; }
  .group { display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; text-transform: uppercase; }
  .plus { min-width: 44px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-left: 32px; }
  .pop { animation: pop .25s ease; }
  @keyframes pop { 45% { transform: scale(1.12); } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button data-tab="today" id="tabToday">Today</button>
    <button data-tab="all" id="tabAll">All</button>
  </div>
  <main id="main"></main>
  <div class="bar">
    <div id="points">0</div>
    <button data-tab="done" id="tabDone">Done</button>
  </div>
</div>

<script>
(function () {
  var KEY = '3things.v1';
  var main = document.getElementById('main');
  var S;
  // What is being typed right now: null, {kind:'today'}, {kind:'task', cat}, {kind:'cat'}
  var editing = null;
  var pickedCat = '';
  var bump = false;

  function dayKey() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function load() {
    try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
    if (!S || !S.tasks) S = { tasks: [], history: [], points: 0, day: dayKey(), tab: 'today' };
    if (!S.cats) {
      S.cats = [];
      S.tasks.forEach(function (t) { if (t.cat && S.cats.indexOf(t.cat) < 0) S.cats.push(t.cat); });
    }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // End of day: finished -> Done, unfinished -> back to All.
  function rollover() {
    if (S.day === dayKey()) return false;
    var fin = S.tasks.filter(function (t) { return t.where === 'today' && t.done; });
    S.history = fin.map(function (t) { return t.text; }).reverse().concat(S.history);
    S.tasks = S.tasks.filter(function (t) { return !(t.where === 'today' && t.done); })
      .map(function (t) { if (t.where === 'today') { t.where = 'all'; t.done = false; } return t; });
    S.day = dayKey();
    save();
    return true;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function find(id) { for (var i = 0; i < S.tasks.length; i++) if (String(S.tasks[i].id) === String(id)) return S.tasks[i]; return null; }
  function todays() { return S.tasks.filter(function (t) { return t.where === 'today'; }); }
  function newTask(text, cat, where) { S.tasks.push({ id: Date.now() + '' + Math.floor(Math.random() * 1000), text: text, cat: cat, where: where, done: false }); }

  var INPUT = '<input id="field" type="text" autocapitalize="characters" autocomplete="off" spellcheck="true" enterkeyhint="done">';

  function render() {
    var today = todays();
    var doneCount = today.filter(function (t) { return t.done; }).length;
    var tt = document.getElementById('tabToday');
    tt.textContent = 'Today ' + doneCount + '/3';
    tt.className = S.tab === 'today' ? 'on' : '';
    document.getElementById('tabAll').className = S.tab === 'all' ? 'on' : '';
    document.getElementById('tabDone').className = S.tab === 'done' ? 'on' : '';
    var pts = document.getElementById('points');
    pts.textContent = S.points.toLocaleString('en-US');
    if (bump) { pts.classList.remove('pop'); void pts.offsetWidth; pts.classList.add('pop'); bump = false; }

    var h = '';
    if (S.tab === 'today') {
      main.className = 'today';
      today.forEach(function (t, i) {
        h += '<div class="row"><span class="n">' + (i + 1) + '</span><span class="task' + (t.done ? ' done' : '') +
             '" data-id="' + t.id + '">' + esc(t.text) + (t.cat ? ' / ' + esc(t.cat) : '') + '</span></div>';
      });
      var n = today.length;
      var typing = editing && editing.kind === 'today';
      if (typing) {
        n++;
        h += '<div class="row"><span class="n">' + n + '</span><span class="grow">' + INPUT + '</span></div>';
        if (S.cats.length) {
          h += '<div class="chips">';
          S.cats.forEach(function (c) {
            h += '<button class="chip' + (pickedCat === c ? ' on' : '') + '" data-chip="' + esc(c) + '">' + esc(c) + '</button>';
          });
          h += '</div>';
        }
      } else if (today.length < 3) {
        n++;
        h += '<div class="row"><span class="n">' + n + '</span><button class="grow" data-add="today">+</button></div>';
      }
      while (n < 3) { n++; h += '<div class="row"><span class="n">' + n + '</span><span>—</span></div>'; }
      if (!typing && today.length >= 3) h += '<button data-add="today">...</button>';
    } else if (S.tab === 'all') {
      main.className = 'list';
      h += '<div class="groups">';
      var cats = S.cats.slice();
      if (S.tasks.some(function (t) { return t.where === 'all' && !t.cat; })) cats.push('');
      cats.forEach(function (c) {
        var items = S.tasks.filter(function (t) { return t.where === 'all' && (t.cat || '') === c; });
        h += '<div class="group"><div class="head" data-cat="' + esc(c) + '"><span>' + (c ? esc(c) : 'Other') + ':</span>' +
             '<button class="plus" data-add="task" data-for="' + esc(c) + '">+</button></div>';
        items.forEach(function (t) { h += '<div class="task" data-id="' + t.id + '">' + esc(t.text) + '</div>'; });
        if (editing && editing.kind === 'task' && editing.cat === c) h += INPUT;
        h += '</div>';
      });
      if (editing && editing.kind === 'cat') h += '<div class="group">' + INPUT + '</div>';
      else h += '<button data-add="cat">+ Category</button>';
      h += '</div>';
    } else {
      main.className = 'list';
      S.history.forEach(function (x) { h += '<div class="done caps">' + esc(x) + '</div>'; });
    }
    main.innerHTML = h;
    var f = document.getElementById('field');
    if (f) f.focus();
  }

  function commit() {
    var f = document.getElementById('field');
    if (!f || !editing) return false;
    var text = f.value.trim();
    if (!text) return false;
    if (editing.kind === 'today') newTask(text, pickedCat, 'today');
    else if (editing.kind === 'task') newTask(text, editing.cat, 'all');
    else if (editing.kind === 'cat') {
      var name = text.toUpperCase();
      if (S.cats.indexOf(name) < 0) S.cats.push(name);
      save();
      editing = { kind: 'task', cat: name }; // go straight to adding its first task
      return true;
    }
    save();
    return true;
  }

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { editing = null; S.tab = b.getAttribute('data-tab'); save(); render(); });
  });

  // + buttons and category chips
  main.addEventListener('pointerdown', function (e) {
    // keep the keyboard open when tapping a category chip
    if (e.target.closest('[data-chip]')) e.preventDefault();
  });
  main.addEventListener('mousedown', function (e) {
    if (e.target.closest('[data-chip]')) e.preventDefault();
  });
  main.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-chip]');
    if (chip) {
      var c = chip.getAttribute('data-chip');
      pickedCat = pickedCat === c ? '' : c;
      main.querySelectorAll('[data-chip]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-chip') === pickedCat); });
      var f = document.getElementById('field'); if (f) f.focus();
      return;
    }
    var a = e.target.closest('[data-add]');
    if (!a) return;
    var kind = a.getAttribute('data-add');
    if (kind === 'today') { editing = { kind: 'today' }; pickedCat = ''; }
    if (kind === 'task') editing = { kind: 'task', cat: a.getAttribute('data-for') };
    if (kind === 'cat') editing = { kind: 'cat' };
    render();
  });

  // Return key saves; empty Return or tapping away closes
  main.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.target.id !== 'field') return;
    e.preventDefault();
    if (commit()) {
      if (editing.kind === 'today') { pickedCat = ''; if (todays().length >= 3) editing = null; }
    } else editing = null;
    render();
  });
  main.addEventListener('focusout', function (e) {
    if (e.target.id !== 'field') return;
    setTimeout(function () {
      if (document.activeElement && document.activeElement.id === 'field') return;
      commit();
      editing = null; pickedCat = '';
      render();
      document.activeElement && document.activeElement.blur();
    }, 250); // short wait so a tap on a category word keeps the field open
  });

  // Swipes on tasks
  // Today: right = cross out (+1) / undo (-1); left = back to All
  // All: tap = move to Today; left = delete. Left on an empty category name = delete category.
  var drag = null;
  main.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.task, .head');
    if (!el || e.target.closest('button')) return;
    drag = { el: el, id: el.getAttribute('data-id'), cat: el.getAttribute('data-cat'), x: e.clientX, y: e.clientY, dx: 0, moved: false };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(drag.dx)) { reset(); return; }
    if (Math.abs(drag.dx) > 6) {
      drag.moved = true;
      drag.el.classList.add('dragging');
      drag.el.style.transform = 'translateX(' + (drag.dx * 0.6) + 'px)';
    }
  });
  function reset() { if (drag) { drag.el.classList.remove('dragging'); drag.el.style.transform = ''; } drag = null; }
  window.addEventListener('pointerup', function () {
    if (!drag) return;
    var d = drag; reset();
    if (d.cat !== null && d.cat !== undefined && d.id === null) {
      var empty = !S.tasks.some(function (t) { return t.cat === d.cat; });
      if (d.dx < -70 && d.cat && empty) { S.cats = S.cats.filter(function (c) { return c !== d.cat; }); save(); render(); }
      return;
    }
    var t = find(d.id);
    if (!t) return;
    if (S.tab === 'today') {
      if (d.dx > 50) { t.done = !t.done; S.points += t.done ? 1 : -1; if (t.done) bump = true; save(); render(); }
      else if (d.dx < -70 && !t.done) { t.where = 'all'; save(); render(); }
    } else if (S.tab === 'all') {
      if (!d.moved) { t.where = 'today'; save(); render(); }
      else if (d.dx < -70) { S.tasks = S.tasks.filter(function (x) { return x !== t; }); save(); render(); }
    }
  });
  window.addEventListener('pointercancel', reset);

  function check() { if (!editing && rollover()) render(); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 60000);

  load();
  rollover();
  render();
})();
</script>
</body>
</html>
